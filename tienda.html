    <!-- HALLOWEEN: DECORACIÓN VISUAL -->
    <style>
        .halloween-decor {
            position: fixed;
            inset: 0;
            z-index: 8000;
            overflow: hidden;
            pointer-events: none;
            isolation: isolate;
            user-select: none;
            -webkit-user-select: none;
        }

        .halloween-decor *,
        .halloween-decor *::before,
        .halloween-decor *::after {
            box-sizing: border-box;
        }

        /* LUNA SANGRIENTA */
        .halloween-luna {
            position: absolute;
            top: 9%;
            right: 8%;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 28%,
                    #ffe1d0 0%,
                    #d95761 30%,
                    #811329 66%,
                    #260414 100%);
            box-shadow:
                0 0 15px rgba(255, 25, 55, .45),
                0 0 40px rgba(130, 0, 35, .35);
            opacity: .82;
        }

        .halloween-luna::before,
        .halloween-luna::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(54, 0, 18, .42);
        }

        .halloween-luna::before {
            width: 16px;
            height: 12px;
            top: 19px;
            left: 17px;
        }

        .halloween-luna::after {
            width: 11px;
            height: 11px;
            right: 17px;
            bottom: 18px;
        }

        /* NIEBLA */
        .halloween-decor::before,
        .halloween-decor::after {
            content: "";
            position: absolute;
            left: -20%;
            bottom: 0;
            width: 140%;
            height: 23%;
            background:
                radial-gradient(ellipse at 20% 70%, rgba(100, 0, 125, .17), transparent 56%),
                radial-gradient(ellipse at 60% 55%, rgba(45, 0, 80, .2), transparent 60%),
                radial-gradient(ellipse at 85% 75%, rgba(145, 0, 25, .13), transparent 50%);
            filter: blur(16px);
            opacity: .7;
        }

        .halloween-decor::after {
            bottom: 10%;
            opacity: .4;
        }

        /* CALABAZAS DEMONÍACAS */
        .halloween-pumpkin {
            position: absolute;
            width: clamp(75px, 10vw, 125px);
            filter:
                drop-shadow(0 0 8px rgba(255, 25, 0, .75)) drop-shadow(0 7px 12px rgba(0, 0, 0, .9));
        }

        .halloween-pumpkin svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .halloween-pumpkin-left {
            left: 5px;
            top: 39%;
        }

        .halloween-pumpkin-right {
            right: 5px;
            top: 64%;
            width: clamp(65px, 8vw, 100px);
        }

        /* BRUJA */
        .halloween-witch {
            position: absolute;
            top: 22%;
            left: -210px;
            width: 150px;
            height: 100px;
            opacity: .85;
            filter: drop-shadow(0 0 7px rgba(120, 0, 180, .6));
            animation: halloween-witch-flight 32s linear 1 forwards;
        }

        .halloween-witch svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* FANTASMAS */
        .halloween-ghost {
            position: absolute;
            width: 48px;
            height: 60px;
            opacity: .8;
            filter: drop-shadow(0 0 7px rgba(160, 120, 255, .45));
        }

        .halloween-ghost svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .halloween-ghost-one {
            left: 5%;
            top: 19%;
        }

        .halloween-ghost-two {
            right: 5%;
            top: 46%;
            width: 40px;
        }

        /* MURCIÉLAGOS */
        .halloween-bat {
            position: absolute;
            width: 40px;
            height: 23px;
            opacity: .9;
            filter: drop-shadow(0 0 5px rgba(125, 0, 255, .6));
        }

        .halloween-bat svg {
            width: 100%;
            height: 100%;
        }

        .halloween-bat-one {
            top: 32%;
            left: 19%;
        }

        .halloween-bat-two {
            top: 55%;
            right: 17%;
            width: 30px;
        }

        /* TELARAÑAS */
        .halloween-web {
            position: absolute;
            top: 0;
            width: 95px;
            height: 95px;
            opacity: .55;
            filter: drop-shadow(0 0 4px rgba(140, 65, 200, .45));
        }

        .halloween-web-left {
            left: 0;
        }

        .halloween-web-right {
            right: 0;
            transform: scaleX(-1);
        }

        .halloween-web svg {
            width: 100%;
            height: 100%;
        }

        /* ZOMBIS */
        .halloween-zombie {
            position: absolute;
            width: clamp(65px, 9vw, 105px);
            height: auto;
            opacity: .92;
            filter: drop-shadow(0 0 7px rgba(40, 255, 60, .4));
        }

        .halloween-zombie svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        .halloween-zombie-left {
            left: 2%;
            bottom: 17%;
        }

        .halloween-zombie-right {
            right: 2%;
            bottom: 7%;
            width: clamp(58px, 7vw, 85px);
        }

        /* CALAVERAS */
        .halloween-skull {
            position: absolute;
            width: clamp(36px, 5vw, 57px);
            height: auto;
            opacity: .85;
            filter: drop-shadow(0 0 6px rgba(255, 25, 45, .5));
        }

        .halloween-skull svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .halloween-skull-one {
            top: 68%;
            left: 15%;
        }

        .halloween-skull-two {
            top: 15%;
            right: 22%;
            width: clamp(30px, 4vw, 43px);
        }

        .halloween-skull-three {
            bottom: 25%;
            right: 14%;
            width: clamp(33px, 4.5vw, 50px);
        }

        /* TUMBAS */
        .halloween-grave {
            position: absolute;
            bottom: 0;
            width: clamp(76px, 10vw, 125px);
            height: clamp(115px, 15vw, 175px);
            opacity: .86;
            filter:
                drop-shadow(0 0 7px rgba(120, 0, 25, .5)) drop-shadow(0 7px 12px rgba(0, 0, 0, .9));
        }

        .halloween-grave svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .halloween-grave-left {
            left: 9%;
            bottom: -2px;
        }

        .halloween-grave-right {
            right: 9%;
            bottom: -2px;
            width: clamp(70px, 9vw, 110px);
            height: clamp(105px, 14vw, 155px);
        }

        .halloween-grave-center {
            left: 50%;
            bottom: -15px;
            width: clamp(60px, 7vw, 85px);
            height: clamp(90px, 12vw, 130px);
            transform: translateX(-50%);
            opacity: .45;
        }

        /* SUELO DEL CEMENTERIO */
        .halloween-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 32px;
            background: linear-gradient(180deg,
                    transparent,
                    rgba(10, 4, 12, .65) 35%,
                    rgba(4, 2, 5, .92));
            border-top: 1px solid rgba(110, 15, 35, .22);
        }

        /* VUELO DE LA BRUJA */
        @keyframes halloween-witch-flight {
            0% {
                transform: translateX(0) translateY(0) rotate(-4deg);
            }

            45% {
                transform: translateX(55vw) translateY(-12px) rotate(2deg);
            }

            100% {
                transform: translateX(calc(100vw + 250px)) translateY(5px) rotate(-2deg);
            }
        }

        /* MÓVILES */
        @media (max-width: 600px) {
            .halloween-luna {
                width: 48px;
                height: 48px;
                top: 12%;
                right: 9%;
            }

            .halloween-pumpkin-left {
                left: 1px;
                top: 42%;
                width: 67px;
            }

            .halloween-pumpkin-right {
                right: 1px;
                top: 68%;
                width: 58px;
            }

            .halloween-ghost-one {

                width: 38px;
                height: 49px;
            }

            .halloween-ghost-two {
                right: 3%;
                top: 49%;
                width: 33px;
                height: 44px;
            }

            .halloween-bat-one {
                left: 22%;
                top: 34%;
                width: 31px;
            }

            .halloween-bat-two {
                right: 20%;
                top: 57%;
                width: 26px;
            }

            .halloween-web {
                width: 58px;
                height: 58px;
            }

            .halloween-zombie-left {
                left: 0;
                bottom: 14%;
                width: 58px;
            }

            .halloween-zombie-right {
                right: 0;
                bottom: 7%;
                width: 52px;

            .halloween-skull-one {

            .halloween-skull-two {

                top: 19%;

            .halloween-skull-three {
                right: 12%;

                width: 31px;
            }

            .halloween-grave-left {
                left: 5%;
                width: 70px;
                height: 105px;
            }

            .halloween-grave-right {
                right: 5%;
                width: 65px;
                height: 96px;
            }

            .halloween-grave-center {
                width: 48px;
                height: 75px;
                opacity: .32;
            }

            .halloween-ground {
                height: 22px;
            }
        }

        /* REDUCIR ANIMACIÓN SI EL USUARIO LO PREFIERE */
        @media (prefers-reduced-motion: reduce) {
            .halloween-witch {
                animation: none !important;
                left: auto;
                right: 12%;
            }
        }
    </style>
</head>

    <!-- APP ORIGINAL -->
    <div class="app">

        <!-- TIENDA -->
        <main class="tienda">

            <!-- ENCABEZADO -->
            <div class="tienda-header">
                <h1>Tienda</h1>
                <p>Encuentra todo lo que buscas en DL Luxury.</p>
            </div>

            <!-- HOMBRE / MUJER -->
            <div class="categorias-genero">

                <button type="button" class="genero-btn active" data-genero="todos">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Todos</span>
                </button>

                <button type="button" class="genero-btn" data-genero="hombre">
                    <i class="fa-solid fa-person"></i>
                    <span>Para él</span>
                </button>

                <button type="button" class="genero-btn" data-genero="mujer">
                    <i class="fa-solid fa-person-dress"></i>
                    <span>Para ella</span>
                </button>

            </div>

            <!-- BUSCADOR -->
            <div class="buscador-tienda">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscarProducto" placeholder="Buscar productos..." autocomplete="off">
            </div>

            <!-- FILTROS -->
            <div class="tienda-controles">

                <select id="filtroCategoria">
                    <option value="todos">Todas las categorías</option>
                    <option value="gorras">Gorras</option>
                    <option value="playeras">Playeras</option>
                    <option value="hoodies">Hoodies</option>
                    <option value="perfumes">Perfumes</option>
                    <option value="accesorios">Accesorios biker</option>
                    <option value="descuentos">Descuentos</option>
                </select>

                <select id="ordenarProductos">
                    <option value="default">Ordenar por</option>
                    <option value="precio-menor">Precio: menor a mayor</option>
                    <option value="precio-mayor">Precio: mayor a menor</option>
                    <option value="nombre-az">Nombre: A - Z</option>
                    <option value="nombre-za">Nombre: Z - A</option>
                </select>

            </div>

            <!-- PRODUCTOS -->
            <div class="productos-tienda" id="productosTienda"></div>

            <!-- SIN RESULTADOS -->
            <div id="sinResultados" class="sin-resultados" style="display: none;">
                <i class="fa-solid fa-box-open"></i>
                <h3>No encontramos productos</h3>
                <p>Intenta buscar otro producto o cambia los filtros.</p>
            </div>

        </main>

        <!-- MODAL PRODUCTO -->
        <div class="modal-producto" id="modalProducto">

            <div class="modal-producto-contenido">

                <button class="modal-cerrar" id="cerrarModalProducto" type="button" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div class="modal-producto-imagen">
                    <img id="modalProductoImagen" src="" alt="Producto">
                </div>

                <div class="modal-producto-info">

                    <span class="modal-producto-categoria" id="modalProductoCategoria">
                        Producto
                    </span>

                    <h2 id="modalProductoNombre">Producto</h2>

                    <div class="modal-producto-precios">
                        <span class="modal-precio-original" id="modalProductoPrecioOriginal">
                            Q0.00
                        </span>

                        <span class="modal-precio-final" id="modalProductoPrecio">
                            Q0.00
                        </span>

                        <span class="modal-descuento" id="modalProductoDescuento">
                            -0%
                        </span>
                    </div>

                    <p class="modal-producto-stock">
                        Stock disponible:
                        <strong id="modalProductoStock">0</strong>
                    </p>

                    <button class="modal-btn-carrito" id="modalProductoComprar" type="button">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Carrito de compras
                    </button>

                    <button class="modal-btn-favorito" id="modalProductoFavorito" type="button">
                        <i class="fa-regular fa-heart"></i>
                        Favorito
                    </button>

                </div>

            </div>

        </div>
